[agent]
name = "nkosi-agent"
db_path = "/var/lib/nkosi/nkosi.db"
log_path = "/var/log/nkosi/agent.log"

[monitors]
# Zones d'entrée malwares + points de persistance
watched_paths = [
    "/home", "/tmp", "/var/tmp",
    "/etc/cron.d", "/etc/cron.daily", "/etc/cron.hourly",
    "/etc/cron.weekly", "/etc/cron.monthly",
    "/etc/systemd/system", "/etc/init.d",
    "/root/.config/autostart",
    "/home/*/.config/autostart",
]
excluded_paths = [
    "/proc", "/sys", "/run",
    "/home/*/.cache",
    "*/.git",
    "*/node_modules",
    "*/target",
    "/var/lib/docker",
]
process_monitor_enabled = true
network_monitor_enabled = true

[risk]
low_threshold = 30
suspicious_threshold = 70
malicious_threshold = 70

[risk.weights]
hash = 80
yara = 40
static_analysis = 20
behavior = 30
network = 50

[quarantine]
path = "/var/lib/nkosi/quarantine"
remove_permissions = true

[threat_intel]
update_interval_hours = 6

[[threat_intel.sources]]
name = "MalwareBazaar"
url = "https://bazaar.abuse.ch/export/txt/sha256/recent/"
enabled = true

[[threat_intel.sources]]
name = "ThreatFox"
url = "https://threatfox.abuse.ch/export/csv/recent/"
enabled = true

[logging]
level = "info"
file_path = "/var/log/nkosi/agent.log"
max_size_mb = 100
retention_days = 30

[notifications]
enabled = true
min_level = "warning"

[notifications.console]
colored = true

