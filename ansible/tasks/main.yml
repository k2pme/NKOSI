---
# tasks/main.yml
- name: Install dependencies
  apt:
    name:
      - curl
      - ca-certificates
      - iptables
      - sqlite3
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Create nkosi group
  group:
    name: "{{ nkosi_group }}"
    state: present

- name: Create nkosi user
  user:
    name: "{{ nkosi_user }}"
    group: "{{ nkosi_group }}"
    shell: /bin/false
    system: yes
    create_home: no

- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nkosi_user }}"
    group: "{{ nkosi_group }}"
    mode: '0755'
  loop:
    - "{{ nkosi_config_dir }}"
    - "{{ nkosi_data_dir }}"
    - "{{ nkosi_log_dir }}"

- name: Download NKOSI binary
  get_url:
    url: "https://github.com/nkosi/nkosi/releases/download/v{{ nkosi_version }}/nkosi-{{ nkosi_version }}-linux-amd64.tar.gz"
    dest: "/tmp/nkosi-{{ nkosi_version }}.tar.gz"
    mode: '0644'
  register: nkosi_download

- name: Extract NKOSI binaries
  unarchive:
    src: "/tmp/nkosi-{{ nkosi_version }}.tar.gz"
    dest: "{{ nkosi_install_dir }}"
    remote_src: yes
    owner: root
    group: root
  when: nkosi_download.changed

- name: Set permissions
  file:
    path: "{{ nkosi_install_dir }}/nkosi-{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop:
    - agent
    - cli
    - api

- name: Install configuration
  template:
    src: nkosi.toml.j2
    dest: "{{ nkosi_config_dir }}/nkosi.toml"
    owner: root
    group: "{{ nkosi_group }}"
    mode: '0640'
  notify: restart nkosi

- name: Install systemd service
  template:
    src: nkosi-agent.service.j2
    dest: /etc/systemd/system/nkosi-agent.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload systemd
    - restart nkosi

- name: Enable and start service
  systemd:
    name: nkosi-agent
    enabled: "{{ nkosi_service_enabled }}"
    state: "{{ nkosi_service_state }}"
    daemon_reload: yes

- name: Install man page
  copy:
    src: ../man/nkosi.1
    dest: /usr/share/man/man1/nkosi.1
    owner: root
    group: root
    mode: '0644'

- name: Install shell completions
  copy:
    src: "../completions/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - { src: "_nkosi", dest: "/usr/share/zsh/vendor-completions/_nkosi" }
    - { src: "nkosi.bash", dest: "/etc/bash_completion.d/nkosi" }
