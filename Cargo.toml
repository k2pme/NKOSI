[workspace]
resolver = "2"
members = [
    "nkosi-common",
    "nkosi-db",
    "nkosi-core",
    "nkosi-agent",
    "nkosi-monitors",
    "nkosi-engines",
    "nkosi-risk",
    "nkosi-response",
    "nkosi-ti",
    "nkosi-cli",
    "nkosi-ui", "nkosi-notify", "nkosi-scanner", "nkosi-api", "nkosi-central", "nkosi-console",
    "tests",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
tempfile = "3"
lru = "0.12"

[workspace.dev-dependencies]
tokio-test = "0.4"
