version: '3.8'

services:
  # NKOSI Agent
  nkosi-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nkosi-agent
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config/nkosi.toml:/etc/nkosi/nkosi.toml:ro
      - nkosi-data:/var/lib/nkosi
      - nkosi-logs:/var/log/nkosi
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/log:/var/log/host:ro
    environment:
      - RUST_LOG=info
      - NKOSI_DB_PATH=/var/lib/nkosi/nkosi.db
    ports:
      - "8080:8080"
    networks:
      - nkosi-net

  # NKOSI Central (optional - for multi-server)
  nkosi-central:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nkosi-central
    restart: unless-stopped
    command: ["nkosi-central"]
    volumes:
      - ./config/nkosi.toml:/etc/nkosi/nkosi.toml:ro
      - nkosi-central-data:/var/lib/nkosi
    environment:
      - RUST_LOG=info
    ports:
      - "50051:50051"
    networks:
      - nkosi-net

  # NKOSI Centralized Console (multi-server web dashboard, F2.11)
  nkosi-console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nkosi-console
    restart: unless-stopped
    command: ["nkosi-console", "--central-addr", "nkosi-central:50051", "--bind", "0.0.0.0:9090", "--dashboard-dir", "/usr/local/share/nkosi-console"]
    environment:
      - RUST_LOG=info
      - NKOSI_CENTRAL_ADDR=nkosi-central:50051
    depends_on:
      - nkosi-central
    ports:
      - "9090:9090"
    networks:
      - nkosi-net

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: nkosi-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - nkosi-net

volumes:
  nkosi-data:
  nkosi-logs:
  nkosi-central-data:
  redis-data:

networks:
  nkosi-net:
    driver: bridge
